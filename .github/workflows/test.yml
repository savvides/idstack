name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest interpreter in the field (macOS system python3);
          # it is the leg that catches modern-only Python syntax creeping into
          # the preamble's embedded scripts. Pinned to ubuntu-24.04: setup-python
          # has no 3.9 build for Ubuntu 26.04, which ubuntu-latest now resolves to.
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.12'
          # macOS leg covers BSD grep/sed/awk differences. Pinned to 3.12:
          # setup-python has no reliable arm64 3.9 build for macos-latest.
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node 22 is pinned for two suites. test/test-extension.sh imports the shipped extension
      # ES modules; extension/ has no package.json, so Node must detect ESM syntax in .js files
      # itself (the default only from 20.19 / 22.7). test-rendered-landing.js drives Chrome over
      # the global WebSocket, which node exposes unflagged only from 22.4. Declaring node here
      # also keeps smoke-test's node-absent SKIP from silently hiding a failure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Skill bash blocks run in the user's shell, which is zsh on macOS.
      # test/test-skill-shell-zsh.sh (run by smoke-test) needs zsh on Linux too.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Smoke test
        run: ./test/smoke-test.sh
      - name: Integration test
        run: ./test/integration-test.sh
      - name: Manifest-merge unit tests
        run: ./test/test-manifest-merge.sh
      - name: Version-classifier unit tests
        run: ./test/test-version-classifier.sh
      - name: Plugin-status unit tests
        run: ./test/test-plugin-status.sh
      - name: Doctor behavioral tests
        run: ./test/test-doctor.sh
      - name: Status / readiness behavioral tests
        run: ./test/test-status.sh
      - name: Preamble embedded-python tests
        run: ./test/test-preamble-python.sh
      - name: Setup behavioral tests
        run: ./test/test-setup.sh
      - name: Chrome extension unit tests
        run: ./test/test-extension.sh

  # Confirms the guards above actually fail when their bugs return. Slower
  # (copies the repo per mutation), so it runs once rather than per matrix leg.
  #
  # Pinned to 3.9, the oldest supported interpreter: some defects only exist
  # below a given version. PEP 701 (3.12) legalized reusing a quote inside an
  # f-string replacement field, so mutating the preamble f-string bug is a
  # no-op on 3.12 and the suite would skip that case. ubuntu-24.04 for the
  # same reason as the 3.9 test leg: no 3.9 build for Ubuntu 26.04.
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # Node 22 for the same two reasons as the test job, and a hard requirement here: fresh()
      # copies extension/ and smoke runs test-extension.sh in every case, and the landing-page
      # mutations are guarded only by the node suites, so without node they report NOT-GUARDED.
      # The rendered-landing mutation additionally needs Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Skill bash blocks run in the user's shell, which is zsh on macOS.
      # test/test-skill-shell-zsh.sh (run by smoke-test) needs zsh on Linux too.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Mutation test
        run: ./test/mutation-test.sh
