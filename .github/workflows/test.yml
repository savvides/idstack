name: Test

# A push to a PR branch already runs the pull_request event; running push on
# every branch too doubled the matrix and the mutation job for each PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest interpreter in the field (macOS system python3);
          # it is the leg that catches modern-only Python syntax creeping into
          # the preamble's embedded scripts. Pinned to ubuntu-24.04: setup-python
          # has no 3.9 build for Ubuntu 26.04, which ubuntu-latest now resolves to.
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.12'
          # macOS leg covers BSD grep/sed/awk differences. Pinned to 3.12:
          # setup-python has no reliable arm64 3.9 build for macos-latest.
          - os: macos-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Node 22 is pinned for two suites. test/test-extension.sh imports the shipped extension
      # ES modules; extension/ has no package.json, so Node must detect ESM syntax in .js files
      # itself (the default only from 20.19 / 22.7). test-rendered-landing.js drives Chrome over
      # the global WebSocket, which node exposes without a flag from 22.0 (stable from 22.4). Declaring node here
      # also keeps smoke-test's node-absent SKIP from silently hiding a failure.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Skill bash blocks run in the user's shell, which is zsh on macOS.
      # test/test-skill-shell-zsh.sh (run by smoke-test) needs zsh on Linux too.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      # smoke-test runs the other unit and behavioral suites itself (manifest-merge,
      # plugin-status, doctor, status, preamble-python, setup, extension,
      # skill-shell-zsh, ste-check, report-section, citation-tiers,
      # responsive-landing, rendered-landing), so they are not separate steps
      # here. integration-test is the only suite with its own step.
      - name: Smoke test
        run: ./test/smoke-test.sh
      - name: Integration test
        run: ./test/integration-test.sh

  # Windows (#136). Claude Code's Bash tool runs Git Bash there, with the native
  # Windows python3, and python3 can be the Microsoft Store shortcut. The first
  # steps print what the skills see; the doctor steps check both python3 cases.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # /idstack:start reads the OS from uname -s and calls MINGW, MSYS or CYGWIN Windows.
      - name: Shell and python3
        run: |
          uname -s
          command -v python3
          where python3
          python3 --version
          case "$(uname -s)" in MINGW*) ;; *) echo "uname -s does not start with MINGW"; exit 1 ;; esac
      - name: Doctor finds python3
        run: |
          out=$(scripts/idstack-doctor --quick)
          echo "$out"
          [ "$out" = OK ]
      # The runner has the python3 App execution alias, which opens the Microsoft
      # Store; put its folder first on PATH. If an image drops the alias, say so.
      - name: Doctor finds the Microsoft Store shortcut
        run: |
          WA="$(cygpath -u "$LOCALAPPDATA")/Microsoft/WindowsApps"
          if [ ! -e "$WA/python3.exe" ]; then
            echo "SKIP: this runner has no python3 alias in $WA, so PYTHON_WINSTUB is not checked"
            exit 0
          fi
          ls -l "$WA/python3.exe"
          rc=0
          out=$(PATH="$WA:$PATH" scripts/idstack-doctor --quick) || rc=$?
          echo "python3: $(PATH="$WA:$PATH" command -v python3)"
          echo "$out (exit $rc)"
          [ "$rc" = 1 ] && [ "$out" = PYTHON_WINSTUB ]
      # Claude Code writes the plugin path into the skill text in place of
      # ${CLAUDE_PLUGIN_ROOT}. On Windows that path can be C:\... or C:/...;
      # the resolve snippet must find the scripts from both.
      - name: Resolve snippet with a Windows plugin path
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          for root in "$(cygpath -w "$PWD")" "$(cygpath -m "$PWD")"; do
            ROOT="$root" python3 - > "$T/resolve.sh" <<'PY'
          import os, sys
          s = open("templates/snippets/idstack-resolve.sh").read()
          s = s.replace("${CLAUDE_PLUGIN_ROOT}", os.environ["ROOT"])
          sys.stdout.buffer.write(s.encode())
          PY
            cat >> "$T/resolve.sh" <<'SH'
          echo "_IDSTACK=$_IDSTACK"
          "$_IDSTACK/scripts/idstack-doctor" --quick
          SH
            out=$(cd "$T" && bash resolve.sh)
            echo "$out"
            printf '%s\n' "$out" | grep -qx OK
          done
      - name: TEMP preferences diagnostic
        run: |
          mkdir -p "$RUNNER_TEMP/p/.idstack"
          printf '%s' '{"preferences": {"verbosity": "concise", "export_format": "SCORM", "preferred_lms": "moodle", "auto_advance_pipeline": true}}' > "$RUNNER_TEMP/p/.idstack/project.json"
          awk '/^## Preamble: Preferences/{s=1} s && /^```bash$/{f=1; next} f && /^```$/{exit} f' templates/preamble.md | sed 's|" 2>/dev/null \|\| true|"|' > "$RUNNER_TEMP/pb.sh"
          cat "$RUNNER_TEMP/pb.sh"
          cd "$RUNNER_TEMP/p" && bash "$RUNNER_TEMP/pb.sh" | od -c | head -20; echo "rc=${PIPESTATUS[0]}"
      # Not run here, because the harness and not the shipped scripts needs POSIX:
      # smoke-test.sh runs test-setup.sh, and its file checks are the same on every OS;
      # test-setup.sh builds a PATH of symlinks into /usr/bin, and Git Bash's ln -s makes copies;
      # integration-test.sh uses symlinks, POSIX file modes and Python that runs the bash scripts.
      - name: Test suites
        run: |
          failed=""
          for t in test/test-doctor.sh test/test-preamble-python.sh test/test-skill-shell-zsh.sh \
                   test/test-manifest-merge.sh test/test-plugin-status.sh test/test-status.sh \
                   test/test-extension.sh "python3 test/test-ste-check.py" \
                   "python3 test/test-report-section.py" "python3 test/test-citation-tiers.py"; do
            echo "::group::$t"
            $t || failed="$failed $t;"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "Failed:$failed"; exit 1; }

  # Confirms the guards above actually fail when their bugs return. Slower
  # (copies the repo per mutation), so it runs once rather than per matrix leg.
  #
  # Pinned to 3.9, the oldest supported interpreter: some defects only exist
  # below a given version. PEP 701 (3.12) legalized reusing a quote inside an
  # f-string replacement field, so mutating the preamble f-string bug is a
  # no-op on 3.12 and the suite would skip that case. ubuntu-24.04 for the
  # same reason as the 3.9 test leg: no 3.9 build for Ubuntu 26.04.
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # Node 22 for the same two reasons as the test job, and a hard requirement here: many
      # cases run test-extension.sh or a node test file directly, so without node they fail for
      # the wrong reason. smoke-test skips its node suites without node, so the responsive
      # landing-page mutations (guarded only by test-responsive-landing.js and
      # test-rendered-landing.js) would report NOT-GUARDED.
      # The rendered-landing mutation additionally needs Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Skill bash blocks run in the user's shell, which is zsh on macOS.
      # test/test-skill-shell-zsh.sh (run by smoke-test) needs zsh on Linux too.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Mutation test
        run: ./test/mutation-test.sh
