<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>idstack OG card</title>
  <!-- Source for og-image.png (1200x630). Render with headless Chrome:
       chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=og-image.png og-template.html
       Fonts and colors follow docs/index.html (DESIGN.md § Landing page). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --hero-bg:   #163a4a;
      --hero-ink:  #faf8f3;
      --hero-soft: #dfe6e8;
      --hero-rule: #2b5263;
      /* The report dark-mode tier colors: the light ones sink into prussian. */
      --tier-1: #5fc185;
      --tier-2: #6aa6e3;
      --tier-3: #d6a64c;
      --tier-4: #e58f53;
      --tier-5: #a3a3a3;
    }

    html, body {
      width: 1200px;
      height: 630px;
      background: var(--hero-bg);
      color: var(--hero-ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 1200px;
      height: 630px;
      padding: 64px 80px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      font-family: 'Public Sans', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand-beta {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--hero-soft);
      vertical-align: super;
      margin-left: 6px;
    }

    .hero-title {
      font-family: 'Public Sans', sans-serif;
      font-size: 78px;
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.03em;
      max-width: 900px;
      margin-bottom: 26px;
    }
    .lede {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 27px;
      line-height: 1.4;
      color: var(--hero-soft);
      max-width: 940px;
    }
    .cite {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      color: var(--hero-ink);
    }

    .rail { border-top: 1px solid var(--hero-rule); padding-top: 22px; }
    /* 146 studies by tier (T1 41, T2 6, T3 39, T4 25, T5 35), from evidence/references.md. */
    .mix { display: flex; height: 14px; margin-bottom: 16px; }
    .mix span { display: block; height: 100%; }
    .rail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: var(--hero-soft);
    }
    .legend { display: flex; gap: 26px; }
    .legend b { font-weight: 700; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand">idstack<sup class="brand-beta">beta</sup></span>

    <div>
      <h1 class="hero-title">Course design advice that shows its sources.</h1>
      <p class="lede">146 peer-reviewed studies across 11 research domains. Every recommendation names its study and evidence tier, like <span class="cite">[Assessment-8] [T1]</span>.</p>
    </div>

    <div class="rail">
      <div class="mix" aria-hidden="true">
        <span style="width:28.08%;background:var(--tier-1)"></span>
        <span style="width:4.11%;background:var(--tier-2)"></span>
        <span style="width:26.71%;background:var(--tier-3)"></span>
        <span style="width:17.12%;background:var(--tier-4)"></span>
        <span style="width:23.98%;background:var(--tier-5)"></span>
      </div>
      <div class="rail-row">
        <span class="legend">
          <span><b style="color:var(--tier-1)">T1</b>41</span>
          <span><b style="color:var(--tier-2)">T2</b>6</span>
          <span><b style="color:var(--tier-3)">T3</b>39</span>
          <span><b style="color:var(--tier-4)">T4</b>25</span>
          <span><b style="color:var(--tier-5)">T5</b>35</span>
        </span>
        <span>idstack.org</span>
      </div>
    </div>
  </div>
</body>
</html>
